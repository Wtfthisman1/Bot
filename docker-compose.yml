services:
  # База данных. Держит очередь задач, расшифровки и (дальше) аккаунты.
  #
  # Порт наружу — 5433, а не 5432: на этой машине живёт ещё один проект со
  # своим Postgres на стандартном порту, и занимать его значило бы ломать
  # соседа при каждом запуске. Внутри контейнера порт обычный.
  #
  # Слушает только 127.0.0.1: база не должна быть доступна из сети, даже
  # из домашней — наружу смотрит один nginx на VPS.
  postgres:
    image: postgres:16-alpine
    container_name: bot-postgres
    ports:
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    environment:
      - POSTGRES_DB=${DB_NAME:-bot_db}
      - POSTGRES_USER=${DB_USER:-bot_user}
      - POSTGRES_PASSWORD=${DB_PASSWORD:?нужен DB_PASSWORD в .env}
      # Явная локаль: сортировка и регистр в русских текстах зависят от неё,
      # а поиск по расшифровкам придёт в фазе 4
      - POSTGRES_INITDB_ARGS=--locale=C.UTF-8 --encoding=UTF8
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      # Без -h база успевает ответить по сокету раньше, чем начнёт слушать TCP,
      # и приложение получает «connection refused» на здоровом контейнере
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${DB_USER:-bot_user} -d ${DB_NAME:-bot_db}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - bot-network

  bot:
    build: 
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: telegram-bot
    # На каком адресе публиковать порт. Умолчание закрытое: раньше здесь стояло
    # «8080:8080», то есть сайт и /internal видело любое устройство домашней
    # сети — мимо nginx, мимо HTTPS и мимо ограничения попыток входа (оно
    # верит X-Real-IP, который перезаписывает nginx).
    #
    # 127.0.0.1 подходит, когда nginx стоит на этой же машине. Когда запросы
    # приходят с VPS по WireGuard, в .env задаётся BIND_ADDRESS=10.8.0.2 —
    # тот же адрес, что и SERVER_ADDRESS для запуска без Docker.
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:8080:8080"
    # Весь .env целиком — и это единственный способ не отстать от него снова.
    # Раньше переменные перечислялись здесь руками, список отстал от
    # systemd-развёртывания, и запуск в Docker молча работал без HOME_API_KEY,
    # без ключей Google и с базой, которую искали на localhost. В образ .env
    # по-прежнему не попадает (см. Dockerfile): env_file читается при запуске.
    env_file:
      - .env
    # Ниже — только то, что внутри контейнера обязано отличаться от .env.
    # environment сильнее env_file, поэтому эти значения побеждают
    environment:
      # Предзагрузка моделей Whisper
      - WHISPER_PRELOAD_MODELS=medium
      - WHISPER_DEVICE=cpu
      - WHISPER_COMPUTE_TYPE=int8
      
      # Настройки приложения
      - UPLOAD_DIR=/app/upload
      - APP_STORAGE_BASE=/app/upload/videos
      - XDG_CACHE_HOME=/app/.cache
      - HF_HOME=/app/.cache/huggingface
      # Пути к Python скриптам для Docker
      - WHISPER_SCRIPT=/app/pythonScript/Transcribe.py
      - DOWNLOADER_SCRIPT=/app/pythonScript/Downloader.py

      # База — в соседнем контейнере, а не на localhost, и порт внутри сети
      # контейнеров обычный. Из .env сюда пришли бы localhost и 5433
      - DB_HOST=postgres
      - DB_PORT=5432

      # Внутри контейнера слушаем все интерфейсы: наружу порт всё равно
      # опубликован одним адресом (см. ports), а привязка к адресу хоста
      # внутри сетевого пространства контейнера просто не поднимется
      - SERVER_ADDRESS=
    volumes:
      # Пользовательские файлы
      - ./upload:/app/upload
      # Логи приложения
      - ./logs:/app/logs
      # Кеш моделей Whisper (сохраняется между пересборками!)
      - whisper_cache:/app/.cache
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8081/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - bot-network

volumes:
  # Именованный том для кеша моделей
  whisper_cache:
    driver: local
  # Данные Postgres переживают пересоздание контейнера
  postgres_data:
    driver: local

networks:
  bot-network:
    driver: bridge
