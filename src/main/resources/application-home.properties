# ========================================
# ДОМАШНЯЯ ПОЛОВИНА: БАЗА ДАННЫХ
# ========================================
# Настройки лежат отдельным файлом, а не в общем: на VPS базы нет вовсе, и
# пустой автоконфигурации там достаточно, чтобы контекст не поднялся.

# Пустое значение отменяет отключение из application.properties: здесь
# DataSource, JPA и Flyway нужны в полном составе
spring.autoconfigure.exclude=

# Без базы бот не стартует: в ней очередь задач. Поднимается так:
# docker compose up -d postgres
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:bot_db}
spring.datasource.username=${DB_USER:bot_user}
spring.datasource.password=${DB_PASSWORD:}
# Пул маленький сознательно: соединение держат только воркеры и веб-запросы,
# а тяжёлая работа идёт во внешних процессах, а не в базе
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
# При загрузке машины бот и контейнер с базой стартуют одновременно, и Postgres
# обычно готов позже. Полминуты ожидания вместо падения: иначе systemd
# перезапускал бы бота по кругу, пока база поднимается.
spring.datasource.hikari.initialization-fail-timeout=30000

# Схему создаёт и меняет только Flyway. ddl-auto=validate — страховка:
# несовпадение схемы и сущностей должно падать при старте, а не в рантайме
# на первой же задаче
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ========================================
# САЙТ: СЕССИИ И ЖИЗНЬ ЗА ПРОКСИ
# ========================================
# Домашняя половина отдаёт страницы через nginx на VPS, то есть видит запрос
# с адресом 10.8.0.1 и схемой http. Без учёта X-Forwarded-* адрес возврата
# Google собрался бы на внутренний IP, и вход не завершился бы никогда
server.forward-headers-strategy=framework

# Куку сессии наружу отдаём только по HTTPS. Локальная разработка идёт по
# http, поэтому значение включается переменной, а не прибито гвоздём
# Умолчание закрытое: открытое прощало забытую переменную молча, а кука
# без Secure уезжает и по http. Локальную разработку это не ломает —
# браузеры считают localhost защищённым контекстом и такую куку берут
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:true}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
# Вход не должен слетать посреди дня, но и вечная сессия ни к чему
server.servlet.session.timeout=30d

# На каком адресе слушать. Пусто — на всех интерфейсах, как было.
#
# Дома осмысленно указать адрес туннеля (10.8.0.2): иначе сайт и внутренний
# API видит любое устройство домашней сети — мимо nginx и мимо HTTPS. Плата за
# это — зависимость старта от поднятого wg0, поэтому в юните увеличен запас
# попыток перезапуска.
server.address=${SERVER_ADDRESS:}
