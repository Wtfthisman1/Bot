<!doctype html>
<!--
  Форма загрузки: файлы и ссылки → задачи в очередь.

  Страница нарочно самодостаточна — стили внутри, ни одного внешнего файла.
  Сюда приходят по одноразовой ссылке из чата, то есть во встроенном браузере
  Telegram и почти всегда с пустым кэшем: любой отдельный запрос за стилями —
  это лишний круг до сервера перед первой отрисовкой. Здесь весь документ
  приезжает одним ответом и рисуется сразу.

  Слотов больше нет. Раньше на экран сразу вываливались пять пар «файл плюс
  ссылка» — десять полей, из которых заполняют одно. Теперь один выбор файлов
  (телефон умеет отдавать несколько за раз) и одна строка для ссылки, а
  остальное появляется по мере надобности.
-->
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0c0c0d">
  <meta name="robots" content="noindex">
  <title>Загрузка — Транскрибот</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2032%2032'%3E%3Crect%20width='32'%20height='32'%20rx='7'%20fill='%230c0c0d'/%3E%3Cg%20fill='%23c8a96b'%3E%3Crect%20x='6.6'%20y='13'%20width='2.6'%20height='6'%20rx='1.3'/%3E%3Crect%20x='11.8'%20y='8.5'%20width='2.6'%20height='15'%20rx='1.3'/%3E%3Crect%20x='17'%20y='11'%20width='2.6'%20height='10'%20rx='1.3'/%3E%3Crect%20x='22.2'%20y='14.2'%20width='2.6'%20height='3.6'%20rx='1.3'/%3E%3C/g%3E%3C/svg%3E">
  <style>
    /* Те же цвета и меры, что и на сайте: страница одна из его комнат,
       а не отдельная поделка */
    :root {
      --bg: #0c0c0d;
      --panel: #151517;
      --panel-hi: #1b1b1e;
      --line: #232326;
      --line-hi: #33333a;
      --text: #f2efea;
      --dim: #9b968e;
      --faint: #6d6963;
      --gold: #c8a96b;
      --gold-hi: #dcc08a;
      --ok: #86b795;
      --bad: #d98a7b;
      --serif: ui-serif, Georgia, "Iowan Old Style", "Times New Roman", serif;
      --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
              "Helvetica Neue", Arial, sans-serif;
      color-scheme: dark;
    }

    *, *::before, *::after { box-sizing: border-box; }

    html { -webkit-text-size-adjust: 100%; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 16px/1.6 var(--sans);
      -webkit-font-smoothing: antialiased;
    }

    .sheet {
      max-width: 560px;
      margin: 0 auto;
      padding: 28px max(20px, env(safe-area-inset-right))
               calc(40px + env(safe-area-inset-bottom))
               max(20px, env(safe-area-inset-left));
    }

    .head { display: flex; align-items: center; gap: 10px; margin-bottom: 26px; }
    .head svg { display: block; fill: var(--gold); }
    .head span { font-family: var(--serif); font-size: 17px; }

    h1 {
      font: 400 30px/1.2 var(--serif);
      letter-spacing: -0.01em;
      margin: 0 0 10px;
    }
    .sub { margin: 0 0 30px; color: var(--dim); font-size: 15px; }

    .eyebrow {
      margin: 0 0 10px;
      color: var(--faint);
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .block + .block { margin-top: 30px; }

    /* ── выбор файлов ── */

    .drop {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 5px;
      /* Крупная цель под палец: это главное действие страницы, и на телефоне
         в неё попадают не глядя */
      min-height: 110px;
      padding: 22px 18px;
      background: var(--panel);
      border: 1px dashed var(--line-hi);
      border-radius: 14px;
      text-align: center;
      cursor: pointer;
      transition: border-color .12s ease, background-color .12s ease;
    }
    .drop:hover, .drop:focus-within, .drop.over { border-color: var(--gold); background: var(--panel-hi); }
    /* Само поле не прячем через display:none — так оно перестало бы
       принимать фокус с клавиатуры */
    .drop input { position: absolute; width: 1px; height: 1px; opacity: 0; }
    .drop b { font-weight: 500; font-size: 16px; }
    .drop small { color: var(--faint); font-size: 13px; }

    .picked { list-style: none; margin: 12px 0 0; padding: 0; }
    .picked li {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 0;
      border-bottom: 1px solid var(--line);
      font-size: 14px;
    }
    .picked .name {
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .picked .size { flex: none; color: var(--faint); font-size: 13px; }
    .picked .drop-one {
      flex: none;
      width: 34px;
      height: 34px;
      background: none;
      border: 0;
      color: var(--faint);
      font: 20px/1 var(--sans);
      cursor: pointer;
    }
    .picked .drop-one:hover { color: var(--bad); }

    /* ── ссылки ── */

    input[type=url] {
      width: 100%;
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 13px 14px;
      /* Ровно 16px: от меньшего Safari на iPhone приближает страницу
         при касании поля и обратно не отдаёт */
      font: 16px/1.4 var(--sans);
      transition: border-color .12s ease;
    }
    input[type=url] + input[type=url] { margin-top: 10px; }
    input[type=url]::placeholder { color: var(--faint); }
    input[type=url]:focus { outline: none; border-color: var(--gold); background: var(--panel-hi); }
    input[type=url].wrong { border-color: var(--bad); }

    .more {
      margin-top: 12px;
      padding: 0;
      background: none;
      border: 0;
      color: var(--dim);
      font: 14px var(--sans);
      cursor: pointer;
    }
    .more:hover { color: var(--gold); }
    .more[hidden] { display: none; }

    /* ── отправка ── */

    .send {
      display: block;
      width: 100%;
      min-height: 52px;
      margin-top: 32px;
      padding: 14px 22px;
      background: var(--gold);
      color: #17130b;
      border: 1px solid var(--gold);
      border-radius: 10px;
      font: 500 16px/1.2 var(--sans);
      cursor: pointer;
      transition: background-color .12s ease;
    }
    .send:hover { background: var(--gold-hi); }
    .send:disabled { opacity: .45; cursor: default; }

    .note { margin: 12px 0 0; color: var(--faint); font-size: 13px; text-align: center; }

    /* Одна полоса на всю отправку, а не пять одинаковых: файлы уходят одним
       запросом, и раздельного прогресса у них не бывает — прежние пять полос
       показывали одно и то же число */
    .bar {
      height: 2px;
      margin-top: 26px;
      background: var(--line);
      border-radius: 2px;
      overflow: hidden;
    }
    .bar[hidden] { display: none; }
    .fill { height: 100%; width: 0; background: var(--gold); transition: width .2s linear; }

    .status {
      margin: 22px 0 0;
      padding: 14px 16px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-left: 2px solid var(--gold);
      border-radius: 10px;
      font-size: 15px;
    }
    .status[hidden] { display: none; }
    .status.good { border-left-color: var(--ok); }
    .status.bad { border-left-color: var(--bad); }

    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; }
    }

    @media (min-width: 600px) {
      .sheet { padding-top: 48px; }
      h1 { font-size: 38px; }
    }
  </style>
</head>
<body>

<main class="sheet">

  <div class="head">
    <svg width="19" height="19" viewBox="0 0 32 32" aria-hidden="true" focusable="false">
      <rect x="6.6" y="13" width="2.6" height="6" rx="1.3"/>
      <rect x="11.8" y="8.5" width="2.6" height="15" rx="1.3"/>
      <rect x="17" y="11" width="2.6" height="10" rx="1.3"/>
      <rect x="22.2" y="14.2" width="2.6" height="3.6" rx="1.3"/>
    </svg>
    <span>Транскрибот</span>
  </div>

  <h1>Загрузка</h1>
  <p class="sub">До пяти файлов и до пяти ссылок за раз. Расшифровка придёт
    в чат — эту страницу можно будет закрыть.</p>

  <section class="block">
    <p class="eyebrow">Файлы</p>
    <label class="drop" id="drop">
      <input type="file" id="file" multiple
             accept="audio/*,video/*,.mp3,.wav,.m4a,.ogg,.mp4,.avi,.mkv,.mov,.webm,.flv,.wmv">
      <b>Выбрать аудио или видео</b>
      <small>или перетащить сюда</small>
    </label>
    <ul class="picked" id="picked"></ul>
  </section>

  <section class="block">
    <p class="eyebrow">Ссылки</p>
    <div id="urls">
      <input type="url" name="url" inputmode="url" autocomplete="off"
             spellcheck="false" placeholder="https://youtube.com/…">
    </div>
    <button type="button" class="more" id="addUrl">Добавить ещё ссылку</button>
  </section>

  <div class="bar" id="bar" hidden><div class="fill" id="fill"></div></div>

  <button type="button" class="send" id="send">Отправить</button>
  <p class="note" id="note">Пока ничего не выбрано</p>

  <p class="status" id="status" hidden></p>

</main>

<script>
(function () {
    'use strict';

    var MAX = 5;
    /* Предел стоит на всей отправке, а не на файле: spring.servlet.multipart
       ограничивает max-request-size, и три файла по гигабайту сервер отвергнет
       уже после того, как человек их зальёт. Дешевле сказать сразу */
    var MAX_BYTES = 2500 * 1024 * 1024;

    var token = location.pathname.split('/').pop();

    var fileInput = document.getElementById('file');
    var dropZone  = document.getElementById('drop');
    var pickedList = document.getElementById('picked');
    var urlsBox   = document.getElementById('urls');
    var addUrlBtn = document.getElementById('addUrl');
    var sendBtn   = document.getElementById('send');
    var note      = document.getElementById('note');
    var status    = document.getElementById('status');
    var bar       = document.getElementById('bar');
    var fill      = document.getElementById('fill');

    /* Свой список файлов, а не тот, что лежит в поле: из FileList нельзя
       убрать один файл, а убрать лишний — это первое, что делают, промахнувшись
       в галерее. Поле здесь только источник, хранит выбор этот массив */
    var picked = [];
    var done = false;

    /* ─────────── выбор файлов ─────────── */

    fileInput.addEventListener('change', function () {
        add(fileInput.files);
        // Сброс: иначе тот же файл, однажды убранный из списка, второй раз уже
        // не выбрать — значение поля не изменится, и «change» не случится
        fileInput.value = '';
    });

    ['dragenter', 'dragover'].forEach(function (type) {
        dropZone.addEventListener(type, function (e) {
            e.preventDefault();
            dropZone.classList.add('over');
        });
    });
    ['dragleave', 'drop'].forEach(function (type) {
        dropZone.addEventListener(type, function () { dropZone.classList.remove('over'); });
    });
    dropZone.addEventListener('drop', function (e) {
        e.preventDefault();
        add(e.dataTransfer.files);
    });

    function add(list) {
        for (var i = 0; i < list.length; i++) {
            var file = list[i];
            if (picked.length >= MAX) {
                say('Больше ' + MAX + ' файлов за раз не принимаем. Остальные пришлите следующей ссылкой.', 'bad');
                break;
            }
            // Один и тот же файл легко выбрать дважды — из галереи и перетаскиванием
            var twice = picked.some(function (had) {
                return had.name === file.name && had.size === file.size;
            });
            if (!twice) picked.push(file);
        }
        drawPicked();
        count();
    }

    function drawPicked() {
        pickedList.textContent = '';
        picked.forEach(function (file, index) {
            var row = document.createElement('li');

            var name = document.createElement('span');
            name.className = 'name';
            name.textContent = file.name;

            var size = document.createElement('span');
            size.className = 'size';
            size.textContent = megabytes(file.size);

            var kill = document.createElement('button');
            kill.type = 'button';
            kill.className = 'drop-one';
            kill.textContent = '×';
            kill.title = 'Убрать';
            kill.addEventListener('click', function () {
                picked.splice(index, 1);
                drawPicked();
                count();
            });

            row.append(name, size, kill);
            pickedList.append(row);
        });
    }

    /* ─────────── ссылки ─────────── */

    addUrlBtn.addEventListener('click', function () {
        // Кнопка к этому моменту уже спрятана, но проверка стоит здесь, а не
        // только в конце: спрятанное — это про глаза, а предел должен быть
        // пределом
        if (urlsBox.children.length >= MAX) return;

        var field = document.createElement('input');
        field.type = 'url';
        field.name = 'url';
        field.inputMode = 'url';
        field.autocomplete = 'off';
        field.spellcheck = false;
        field.placeholder = 'https://…';
        urlsBox.append(field);
        field.focus();
        if (urlsBox.children.length >= MAX) addUrlBtn.hidden = true;
    });

    urlsBox.addEventListener('input', function (e) {
        e.target.classList.remove('wrong');
        count();
    });

    function urls() {
        return Array.prototype.map.call(urlsBox.children, function (field) {
            return field.value.trim();
        }).filter(Boolean);
    }

    function looksLikeLink(value) {
        try {
            var parsed = new URL(value);
            // yt-dlp ходит по http и https и ни по чему больше; остальные схемы
            // отсеиваем здесь, чтобы не гонять файл ради отказа на сервере
            return parsed.protocol === 'http:' || parsed.protocol === 'https:';
        } catch (e) {
            return false;
        }
    }

    /* ─────────── что сейчас выбрано ─────────── */

    /*
      Строка под кнопкой отвечает на вопрос, который иначе задают уже после
      нажатия: сколько всего уходит и не слишком ли это много.
    */
    function count() {
        if (done) return;

        var linkCount = urls().length;
        var bytes = picked.reduce(function (sum, file) { return sum + file.size; }, 0);

        if (!picked.length && !linkCount) {
            note.textContent = 'Пока ничего не выбрано';
            return;
        }

        var parts = [];
        if (picked.length) parts.push(picked.length + ' ' + word(picked.length, 'файл', 'файла', 'файлов'));
        if (linkCount) parts.push(linkCount + ' ' + word(linkCount, 'ссылка', 'ссылки', 'ссылок'));
        if (bytes) parts.push(megabytes(bytes));

        note.textContent = parts.join(' · ');
        if (bytes > MAX_BYTES) {
            note.textContent += ' — больше предела в ' + megabytes(MAX_BYTES);
        }
    }

    /* ─────────── отправка ─────────── */

    sendBtn.addEventListener('click', function () {
        if (done) return;

        var links = urls();
        var wrong = Array.prototype.filter.call(urlsBox.children, function (field) {
            var bad = field.value.trim() && !looksLikeLink(field.value.trim());
            field.classList.toggle('wrong', bad);
            return bad;
        });

        if (wrong.length) {
            say('Проверьте ссылки: нужен полный адрес, вместе с https://', 'bad');
            wrong[0].focus();
            return;
        }
        if (!picked.length && !links.length) {
            say('Выберите файл или вставьте ссылку.', 'bad');
            return;
        }

        var bytes = picked.reduce(function (sum, file) { return sum + file.size; }, 0);
        if (bytes > MAX_BYTES) {
            say('За один раз принимаем до ' + megabytes(MAX_BYTES) + '. Разбейте отправку надвое: '
                + 'ссылку на форму бот выдаст ещё раз.', 'bad');
            return;
        }

        var form = new FormData();
        picked.forEach(function (file) { form.append('file', file); });
        links.forEach(function (link) { form.append('url', link); });

        sendBtn.disabled = true;
        sendBtn.textContent = 'Отправляем…';
        bar.hidden = false;
        status.hidden = true;

        var xhr = new XMLHttpRequest();
        var startedAt = Date.now();

        xhr.upload.onprogress = function (e) {
            if (!e.lengthComputable) return;
            var part = e.loaded / e.total;
            fill.style.width = (part * 100) + '%';

            var perSecond = e.loaded / Math.max(1, (Date.now() - startedAt) / 1000);
            note.textContent = Math.round(part * 100) + '% · ' + megabytes(e.loaded)
                + ' из ' + megabytes(e.total) + ' · ' + megabytes(perSecond) + '/с';
        };

        xhr.onload = function () {
            fill.style.width = '100%';

            if (xhr.status === 200) {
                // Страницу не перезагружаем: ссылка одноразовая, и обновлённая
                // форма выглядела бы рабочей, а на первой же отправке отвечала
                // 403 — человек видел бы ошибку сразу после успеха
                say('Принято. Расшифровка придёт в чат — страницу можно закрыть.', 'good');
                finish('Отправлено');
                return;
            }
            if (xhr.status === 403) {
                say('Ссылка уже использована. Попросите у бота новую — кнопка «Загрузить файлы».', 'bad');
                finish('Ссылка недействительна');
                return;
            }
            if (xhr.status === 413) {
                say('Сервер отказался принять такой объём. Пришлите файлы по частям.', 'bad');
                again();
                return;
            }
            say(xhr.responseText || 'Не получилось загрузить. Попробуйте ещё раз.', 'bad');
            again();
        };

        xhr.onerror = function () {
            say('Связь оборвалась. Проверьте интернет и отправьте ещё раз — '
                + 'ссылка остаётся рабочей.', 'bad');
            again();
        };

        xhr.open('POST', '/upload/' + encodeURIComponent(token));
        xhr.send(form);
    });

    /*
      Конец работы формы: отправлять по этой ссылке больше нечего.

      Кнопка не просто гаснет, а меняет подпись: серая кнопка без объяснения
      читается как поломка, а не как «всё уже сделано».
    */
    function finish(label) {
        done = true;
        sendBtn.disabled = true;
        sendBtn.textContent = label;
        note.textContent = '';
        bar.hidden = true;
    }

    /* Отказ, после которого попытка ещё имеет смысл: возвращаем форму в работу */
    function again() {
        sendBtn.disabled = false;
        sendBtn.textContent = 'Отправить';
        bar.hidden = true;
        fill.style.width = '0';
        count();
    }

    function say(text, kind) {
        status.textContent = text;
        status.className = 'status ' + kind;
        status.hidden = false;
    }

    function megabytes(bytes) {
        if (bytes >= 1024 * 1024 * 1024) return (bytes / (1024 * 1024 * 1024)).toFixed(1) + ' ГБ';
        if (bytes >= 1024 * 1024) return Math.round(bytes / (1024 * 1024)) + ' МБ';
        return Math.max(1, Math.round(bytes / 1024)) + ' КБ';
    }

    /* Русский счёт: «1 файл», «2 файла», «5 файлов» */
    function word(n, one, few, many) {
        var tens = n % 100;
        if (tens > 10 && tens < 20) return many;
        var units = n % 10;
        if (units === 1) return one;
        if (units >= 2 && units <= 4) return few;
        return many;
    }
})();
</script>
</body>
</html>
