<!DOCTYPE html>
<!--
  Страница вместо формы, когда ссылка уже сработала или просрочена.

  Отдельная страница, а не отказ поверх формы: живая на вид форма провоцирует
  выбрать файл и ждать конца загрузки, чтобы в конце получить 403. Здесь сразу
  видно, что делать дальше.
-->
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0c0c0d">
  <meta name="robots" content="noindex">
  <title>Ссылка недействительна — Транскрибот</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2032%2032'%3E%3Crect%20width='32'%20height='32'%20rx='7'%20fill='%230c0c0d'/%3E%3Cg%20fill='%23c8a96b'%3E%3Crect%20x='6.6'%20y='13'%20width='2.6'%20height='6'%20rx='1.3'/%3E%3Crect%20x='11.8'%20y='8.5'%20width='2.6'%20height='15'%20rx='1.3'/%3E%3Crect%20x='17'%20y='11'%20width='2.6'%20height='10'%20rx='1.3'/%3E%3Crect%20x='22.2'%20y='14.2'%20width='2.6'%20height='3.6'%20rx='1.3'/%3E%3C/g%3E%3C/svg%3E">
  <style>
    /* Стили внутри и здесь: страницу открывают один раз из чата,
       и отдельный запрос за оформлением ради неё не окупается */
    :root { color-scheme: dark; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px max(20px, env(safe-area-inset-right))
               calc(24px + env(safe-area-inset-bottom))
               max(20px, env(safe-area-inset-left));
      background: #0c0c0d;
      color: #f2efea;
      font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
            "Helvetica Neue", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .card {
      max-width: 440px;
      padding: 32px 26px;
      background: #151517;
      border: 1px solid #232326;
      border-radius: 16px;
    }

    .mark { display: block; fill: #c8a96b; margin-bottom: 18px; }

    h1 {
      margin: 0 0 14px;
      font: 400 26px/1.25 ui-serif, Georgia, "Iowan Old Style", "Times New Roman", serif;
      letter-spacing: -0.01em;
    }

    p { margin: 0 0 12px; color: #9b968e; }
    p:last-child { margin-bottom: 0; }
    b { color: #f2efea; font-weight: 500; }

    /* Успокаивающая часть — отдельно и тише: она нужна не всем,
       но тем, кто только что отправил файл, она нужна очень */
    .calm {
      margin-top: 20px;
      padding-top: 18px;
      border-top: 1px solid #232326;
      color: #6d6963;
      font-size: 14px;
    }
  </style>
</head>
<body>
<main class="card">
  <svg class="mark" width="22" height="22" viewBox="0 0 32 32" aria-hidden="true" focusable="false">
    <rect x="6.6" y="13" width="2.6" height="6" rx="1.3"/>
    <rect x="11.8" y="8.5" width="2.6" height="15" rx="1.3"/>
    <rect x="17" y="11" width="2.6" height="10" rx="1.3"/>
    <rect x="22.2" y="14.2" width="2.6" height="3.6" rx="1.3"/>
  </svg>

  <h1>Ссылка уже недействительна</h1>
  <p>Ссылка на форму одноразовая и живёт час. Эта уже сработала или просрочена.</p>
  <p>Попросите новую в чате: кнопка <b>«Загрузить файлы»</b>.</p>

  <p class="calm">Если вы только что отправили файл — всё в порядке, он принят.
    Расшифровка придёт в чат, повторять отправку не нужно.</p>
</main>
</body>
</html>
