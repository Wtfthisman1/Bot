spring.application.name=Bot

# ========================================
# СТАТИЧЕСКИЕ РЕСУРСЫ
# ========================================
# Форму upload.html отдаёт UploadController по одноразовому токену, поэтому
# отдельный WebConfig с маппингом /** больше не нужен — здесь только запрет кэша,
# чтобы правки формы были видны без пересборки образа.
spring.web.resources.cache.period=0
spring.web.resources.chain.cache=false

# ========================================
# НАСТРОЙКИ БОТА (значения — через переменные окружения)
# ========================================
bot.name=${BOT_NAME:FindInform_rail_bot}
# Токен обязателен: без него запуск не имеет смысла — пусть падает на старте
bot.key=${BOT_TOKEN}
# Пустой дефолт: если ADMIN_CHAT_ID не задан, отправка ошибок в Telegram просто отключится
# (BotInitializer обрабатывает пустое/некорректное значение, не роняя контекст)
admin.chat.id=${ADMIN_CHAT_ID:}

spring.devtools.restart.enabled=false

# ========================================
# ССЫЛКИ (upload/download)
# ========================================
# ВАЖНО: в проде задайте публичный адрес через UPLOAD_BASE_URL / DOWNLOAD_BASE_URL —
# по этим ссылкам пользователь открывает форму и качает файлы из Telegram.
# localhost-дефолты годятся только для локальной разработки.
upload.base-url=${UPLOAD_BASE_URL:http://localhost:8080}
download.base-url=${DOWNLOAD_BASE_URL:http://localhost:8080}

# ========================================
# БЕЗОПАСНОСТЬ ТОКЕНОВ
# ========================================
# Одноразовые ссылки на форму загрузки
upload.token.length=8
upload.token.chars=ABCDEFGHIJKLMNOPQRSTUVWXYZ0REDACTED_CHAT_ID
upload.token.ttl.hours=1
# Срок жизни ссылки на скачивание готового файла (DownloadTokenRegistry)
download.token.ttl-hours=24
# Максимальный размер файла, отправляемого прямо в чат (лимит Bot API — 50 МБ)
download.telegram-max-bytes=52428800

# ========================================
# БАЗА ДАННЫХ
# ========================================
# Без базы бот не стартует: в ней очередь задач. Поднимается так:
# docker compose up -d postgres
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:bot_db}
spring.datasource.username=${DB_USER:bot_user}
spring.datasource.password=${DB_PASSWORD:}
# Пул маленький сознательно: соединение держат только воркеры и веб-запросы,
# а тяжёлая работа идёт во внешних процессах, а не в базе
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
# При загрузке машины бот и контейнер с базой стартуют одновременно, и Postgres
# обычно готов позже. Полминуты ожидания вместо падения: иначе systemd
# перезапускал бы бота по кругу, пока база поднимается.
spring.datasource.hikari.initialization-fail-timeout=30000

# Схему создаёт и меняет только Flyway. ddl-auto=validate — страховка:
# несовпадение схемы и сущностей должно падать при старте, а не в рантайме
# на первой же задаче
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ========================================
# ХРАНИЛИЩЕ ФАЙЛОВ
# ========================================
app.storage.base=${user.dir}/upload/videos

spring.servlet.multipart.max-file-size=2500MB
spring.servlet.multipart.max-request-size=2500MB
spring.servlet.multipart.file-size-threshold=2KB
spring.servlet.multipart.location=${java.io.tmpdir}

# ========================================
# ОЧЕРЕДЬ И ОБРАБОТКА ЗАДАЧ
# ========================================
# Количество воркеров, разбирающих очередь (JobWorker).
# Транскрипция CPU-bound (Whisper уже многопоточный) — крупные значения вызовут
# конкуренцию за CPU. Поднимать осторожно и под конкретное железо.
worker.pool-size=2
# Таймаут одной транскрипции (минуты). Длинное видео на CPU может идти часами.
whisper.timeout-minutes=300

# ========================================
# ПЛАНИРОВЩИК И ПУЛЫ SPRING
# ========================================
spring.task.scheduling.pool.size=4
spring.task.execution.pool.core-size=4
spring.task.execution.pool.max-size=8
spring.task.execution.pool.queue-capacity=100

# ========================================
# ВЕБ-СЕРВЕР (Tomcat)
# ========================================
# За обратным прокси Tomcat должен доверять X-Forwarded-*, иначе в логах
# вместо адреса пользователя будет адрес прокси
server.forward-headers-strategy=FRAMEWORK

server.tomcat.threads.max=200
server.tomcat.threads.min-spare=10
server.tomcat.max-connections=8192
server.tomcat.accept-count=100

# ========================================
# ОЧИСТКА ФАЙЛОВ
# ========================================
cleanup.enabled=true
cleanup.retention-days=14
cleanup.schedule=0 0 2 * * ?

# ========================================
# MONITORING / HEALTH
# ========================================
# Actuator слушает ОТДЕЛЬНЫЙ порт и только на localhost. Так его физически
# нельзя выставить наружу, даже если ошибиться в конфиге обратного прокси:
# health/metrics/prometheus доступны с самой машины, но не из интернета.
management.server.port=${MANAGEMENT_PORT:8081}
management.server.address=127.0.0.1
management.endpoints.web.base-path=/actuator
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when-authorized
management.endpoint.health.show-components=when-authorized
management.endpoint.shutdown.enabled=false
# Spring Boot 3.x / Micrometer: проперти переименовано
# (было management.metrics.export.prometheus.enabled)
management.prometheus.metrics.export.enabled=true

# ========================================
# ЛОГИРОВАНИЕ
# ========================================
# logging.level.Bot здесь НЕ задаётся сознательно: Spring Boot применяет его
# после загрузки logback.xml и перекрыл бы уровень логгера. Пакет Bot держится
# на DEBUG в logback.xml, потому что построчный вывод yt-dlp и Whisper должен
# попадать в лог задачи (logs/jobs/job-<id>.log). Видимостью в консоли и
# logs/app.log управляет переменная LOG_LEVEL через ThresholdFilter.
logging.level.org.springframework.web=WARN
logging.level.org.telegram=WARN
# Паттерн консоли живёт в logback.xml (там же MDC chatId/jobId) — здесь не дублируем

# ========================================
# НАСТРОЙКИ PYTHON (Виртуальное окружение)
# ========================================
# Путь к Python внутри виртуального окружения
python.executable.path=/home/dmitry/whisper-env/bin/python3

whisper.model=large-v3
whisper.threads=6
# auto — whisper определяет язык сам. Раньше здесь всегда стоял русский, из-за
# чего англоязычная запись расшифровывалась как русская. Определённый язык
# нужен ещё и для выбора языковой модели при обработке текста.
whisper.language=${WHISPER_LANGUAGE:auto}
whisper.clean-audio=false
whisper.initial-prompt=
whisper.ct-binary=/home/dmitry/whisper-env/bin/whisper-ctranslate2
whisper.script=classpath:pythonScript/Transcribe.py
downloader.script=classpath:pythonScript/Downloader.py
# Каталог с deno: без JS-рантайма свежий yt-dlp не тянет YouTube (403).
# В Docker/systemd задайте через DOWNLOADER_JS_RUNTIME_DIR, если deno лежит не здесь.
downloader.js-runtime-dir=${DOWNLOADER_JS_RUNTIME_DIR:${user.home}/.deno/bin}
# Указываем использование видеокарты (Compute Unified Device Architecture от NVIDIA)
whisper.device=cuda

# Для видеокарт рекомендуется использовать float16 (работает быстрее и точнее на GPU)
whisper.compute-type=float16
