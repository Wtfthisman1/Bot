<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<!--
  Страница по ссылке из чата. Обновлять себя ей больше не нужно: подтверждения
  никто не ждёт — ссылку выдал бот тому, кто её попросил, и остаётся только
  нажать. Поэтому здесь обычная голова документа, без meta refresh.
-->
<head th:replace="~{fragments :: head('Вход через бота')}"></head>
<body>
<header th:replace="~{fragments :: header(null)}"></header>

<main class="page narrow">
    <h1>Войти в кабинет</h1>

    <p class="lead" th:if="${name != null and !name.isEmpty()}">
        Ссылка ведёт в аккаунт <b th:text="${name}">Имя</b>.
    </p>
    <p class="lead" th:unless="${name != null and !name.isEmpty()}">
        Ссылка ведёт в аккаунт, привязанный к чату с ботом.
    </p>

    <!--
      Вход завершает нажатие, а не открытие адреса. По ссылкам ходят не только
      люди: Telegram тянет предпросмотр, антивирусы и почтовые фильтры
      открывают их сами — и вход сгорал бы до того, как человек его увидит.
    -->
    <form method="post" th:action="@{/auth/enter}">
        <input type="hidden" name="token" th:value="${token}">
        <button type="submit" class="button">Войти</button>
    </form>

    <p class="hint">Ссылка одноразовая и действует три минуты.</p>
    <p class="hint">Если вы не просили вход в боте — просто закройте эту
        страницу и никому не пересылайте ссылку.</p>
    <p class="hint"><a href="/login">Другие способы входа</a></p>
</main>

<footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
