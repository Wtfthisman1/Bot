// Задача для очистки
task cleanLogs(type: Delete) {
	delete 'logs'
	delete 'build'
	delete '.gradle'
}

// Задача для проверки безопасности зависимостей
task securityCheck {
	doLast {
		println "Проверка безопасности зависимостей..."
		// Здесь можно добавить проверку через OWASP Dependency Check
	}
}





