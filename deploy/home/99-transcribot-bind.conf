# Разрешить привязку к адресу, которого сейчас нет на интерфейсе.
#
# Ставится в /etc/sysctl.d/ скриптом deploy/home/setup-service.sh.
#
# Зачем: дома приложение слушает адрес туннеля (SERVER_ADDRESS=10.8.0.2), иначе
# сайт и внутренний API видит любое устройство домашней сети — мимо nginx, мимо
# HTTPS и мимо счётчика попыток входа. Но wg0 поднимается не мгновенно, а
# NetworkManager временами снимает с него адрес; без этой настройки служба в
# такой момент не стартует вовсе и ждёт следующей попытки.
#
# Что это НЕ открывает: привязка к чужому адресу не делает порт доступным
# снаружи — пакеты на 10.8.0.2 приходят только через туннель.
net.ipv4.ip_nonlocal_bind = 1
