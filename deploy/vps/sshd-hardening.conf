# Закалка SSH. Ставится deploy/vps/setup-vps.sh в /etc/ssh/sshd_config.d/,
# отдельным файлом: правку в самом sshd_config затирает обновление пакета,
# а drop-in переживает его.
#
# Причина: за неделю до этой правки в журнале VPS было 38 519 неудачных
# попыток входа с 99 адресов, и все они били в root по паролю. Держалось это
# только на длине пароля. Вход по ключу настроен и работает — пароль тут
# не нужен ни для чего.

PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin prohibit-password
PermitEmptyPasswords no

# Меньше попыток на соединение — меньше пользы от каждого подключения перебора
MaxAuthTries 3
